<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora IMC</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#4F46E5,#06B6D4);min-height:100vh;display:flex;justify-content:center;align-items:center;margin:0}
.card{background:white;padding:30px;border-radius:20px;width:90%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h1{text-align:center;color:#4F46E5}
input{width:100%;padding:12px;margin:8px 0 15px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
button{width:100%;padding:14px;background:linear-gradient(90deg,#4F46E5,#06B6D4);color:white;border:none;border-radius:12px;font-weight:bold;font-size:16px}
#resultado{margin-top:20px;padding:15px;border-radius:10px;text-align:center;font-weight:bold;display:none}
</style>
</head>
<body>
<div class="card">
<h1>Calculadora IMC</h1>
<label>Peso (kg)</label>
<input type="number" id="peso" placeholder="Ex: 68.5" step="0.1">
<label>Altura (m)</label>
<input type="number" id="altura" placeholder="Ex: 1.70" step="0.01">
<button onclick="calcular()">Calcular IMC</button>
<div id="resultado"></div>
</div>
<script>
function calcular(){
 let p=parseFloat(document.getElementById('peso').value);
 let a=parseFloat(document.getElementById('altura').value);
 if(!p||!a){alert('Preencha peso e altura');return}
 let imc=p/(a*a);
 let status='';
 if(imc<18.5)status='Abaixo do peso';
 else if(imc<24.9)status='Peso normal';
 else if(imc<29.9)status='Sobrepeso';
 else status='Obesidade';
 let res=document.getElementById('resultado');
 res.style.display='block';
 res.style.background='#EEF2FF';
 res.innerHTML=`Seu IMC: ${imc.toFixed(2)}<br>${status}`;
}
</script>
</body>
</html>
